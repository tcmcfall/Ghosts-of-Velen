<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compendium Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Correct relative paths from /panels/ -->
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    .page-container { padding: 1rem 1.25rem; }
    .content-container { max-width: 960px; margin: 0 auto; }
    .section + .section { margin-top: 1.25rem; }
    h1, h2 { font-family: 'Quattrocento', serif; margin: 0 0 .5rem 0; line-height: 1.2; }
    p { margin: .25rem 0; }
    ul { margin: .5rem 0 .5rem 1.25rem; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      padding: .1em .35em; border: 1px solid #ccc; border-radius: 4px; background: #f7f7f7;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <main class="content-container" aria-labelledby="compendium-title">
      <h1 id="compendium-title">Compendium</h1>

      <section class="section" aria-labelledby="compendium-overview">
        <h2 id="compendium-overview">Overview</h2>
        <p>
          This panel will host region lore, NPCs, factions, bestiary excerpts, and rules references,
          aligned to your 5.5e baseline and Ghosts of Velen setting.
        </p>
      </section>

      <section class="section" aria-labelledby="compendium-usage">
        <h2 id="compendium-usage">Usage</h2>
        <ul>
          <li>Open via the map menu ? <span class="kbd">Compendium</span>.</li>
          <li>Use alongside Journal and Calendar for quick cross-reference during play.</li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
